[package]
name = "noos-firewall"
description = "Pare-feu applicatif de NOOS : démon NFQUEUE + nftables, règles par programme et par port"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "noos-firewalld"
path = "src/bin/noos-firewalld.rs"

[[bin]]
name = "noos-firewall"
path = "src/bin/noos-firewall.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
libc = "0.2.191"
# NFQUEUE en Rust pur (netlink) : pas besoin de libnetfilter-queue1.
nfq = "0.2.6"
