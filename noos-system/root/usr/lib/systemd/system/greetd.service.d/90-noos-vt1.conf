# NOOS : l'écran de connexion (greetd + noos-greeter) occupe la console 1, à la place de la
# console texte. Debian place greetd sur la console 7 : au démarrage, la bascule 1 → 7 se perd
# quand Plymouth rend la main en même temps (greetd attend alors indéfiniment, l'écran reste sur
# « login: »). Sur la console 1, pas de bascule, et l'image de Plymouth reste affichée jusqu'à
# l'écran de connexion (plymouth quit --retain-splash). /etc/greetd/config.toml : vt = 1.
[Unit]
After=getty@tty1.service
Conflicts=getty@tty1.service
