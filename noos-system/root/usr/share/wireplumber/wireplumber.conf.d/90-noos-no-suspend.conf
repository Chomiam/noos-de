# NOOS : WirePlumber met en veille les sorties/entrées audio après 5 s de silence. Sur beaucoup
# de cartes (HDA Intel, USB, HDMI, Bluetooth) le réveil coupe le début du son, fait « clic » ou
# laisse la sortie muette : on désactive cette mise en veille.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
