[package]
name = "libadapta-sys"
version = "0.5.0"
build = "build.rs"
edition = "2021"
description = "FFI bindings for libAdapta (libadwaita with theme support), derived from libadwaita-sys 0.9.2"
license = "MIT"
links = "adapta-1"

[package.metadata.system-deps.libadapta_1]
name = "libadapta-1"
version = "1"

[package.metadata.system-deps.libadapta_1.v1_1]
version = "1.1"

[package.metadata.system-deps.libadapta_1.v1_2]
version = "1.2"

[package.metadata.system-deps.libadapta_1.v1_3]
version = "1.3"

[package.metadata.system-deps.libadapta_1.v1_4]
version = "1.4"

[package.metadata.system-deps.libadapta_1.v1_5]
version = "1.5"

[lib]
name = "libadapta_sys"

[dependencies]
libc = "0.2"
gio-sys = "0.22"
glib-sys = "0.22"
gobject-sys = "0.22"
gtk-sys = { package = "gtk4-sys", version = "0.11" }
gdk-sys = { package = "gdk4-sys", version = "0.11" }
pango-sys = "0.22"

[build-dependencies]
system-deps = "7"

[features]
v1_1 = []
v1_2 = ["v1_1"]
v1_3 = ["v1_2"]
v1_4 = ["v1_3"]
v1_5 = ["v1_4"]

# Les éléments libadwaita > 1.5 restent dans le code mais ne sont jamais compilés.
[lints.rust]
unexpected_cfgs = "allow"
