# Portails XDG pour la session NOOS (XDG_CURRENT_DESKTOP=NOOS).
# - gtk : sélecteur de fichiers, choix d'application, ouverture de liens, paramètres
#         (thème, icônes, mode sombre pour les Flatpak), impression, inhibition…
# - wlr : partage d'écran (xdg-desktop-portal-wlr fourni avec NOOS, via ext-image-copy-capture)
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
