# ISO d'installation de NOOS (Debian sid), à la demande (onglet Actions › ISO › Run workflow).
# Résultat : artefact « noos-iso » (noos-sid-amd64.iso), gardé 7 jours ; avec « release »
# renseigné (ex. v0.1.0-alpha3), l'ISO et SHA256SUMS sont aussi publiés en préversion GitHub.
name: ISO

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Étiquette de la préversion à publier (ex. v0.1.0-alpha3) ; vide = artefact seul"
        required: false
        default: ""
      title:
        description: "Titre de la préversion (facultatif)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - name: Place disque (système live + compilation ≈ 15 Go)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compilation et préparation de NOOS (conteneur Debian sid)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: docker run --rm -e APT_SIGNING_KEY -v "$PWD:/src" -w /src debian:sid bash noos-iso/ci-stage.sh
      - name: Système live et ISO (conteneur privilégié)
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" -v "$PWD/noos-iso/out:/out" debian:sid \
            bash /src/noos-iso/build-inside.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noos-iso
          path: noos-iso/out/*.iso
          retention-days: 7
          compression-level: 0
      - name: Préversion GitHub (ISO + SHA256SUMS)
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          TITLE: ${{ inputs.title }}
        run: |
          cd noos-iso/out
          sha256sum *.iso > SHA256SUMS
          notes="$GITHUB_WORKSPACE/noos-iso/release-notes.md"
          [ -f "$notes" ] || { echo "Préversion de NOOS (Debian sid)." > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$TAG" *.iso SHA256SUMS --prerelease --target "$GITHUB_SHA" \
            --title "${TITLE:-NOOS $TAG}" --notes-file "$notes"
